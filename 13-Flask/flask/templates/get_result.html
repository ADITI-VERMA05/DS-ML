<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get_result</title>
</head>
<body>
    <h2>HTML Forms</h2>

    <form action="/get_result" method="post">
        <label for="Science">Science:</label><br>
        <input type="text" id="science" name="science" value="0" title="Enter Science marks" placeholder="Enter Science marks"><br><br>
        <label for="Maths">Maths:</label><br>
        <input type="text" id="maths" name="maths" value="0" title="Enter Maths marks" placeholder="Enter Maths marks"><br><br>
        <label for="C">C:</label><br>
        <input type="text" id="c" name="c" value="0" title="Enter C marks" placeholder="Enter C marks"><br><br>
        <label for="datascience">Data Science: </label><br>
        <input type="text" id="datascience" name="datascience" value="0" title="Enter Data Science marks" placeholder="Enter Data Science marks"><br><br>
        <input type="submit" value="Submit">
    </form>

<p>If you click the "Submit" button, the form-data will be sent to a page called "/submit".
</body>
</html>
