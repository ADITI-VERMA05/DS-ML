<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucess If</title>
</head>
<body>
    <h1>
        Based on the marks, you have {{results}}

        {% if results >= 50 %}
        <h1> You have passed with marks {{results}}. </h1>
        {% else %}
        <h2> You have failed with {{results}}.</h2>
        {% endif %}
    </h1>
</body>
</html>
